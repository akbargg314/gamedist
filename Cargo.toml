[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/server",
    "crates/cli",
    "crates/launcher",
    "examples/sample-game",
    "tests/e2e",
]
# The Tauri shell needs system WebKit/GTK; it is built separately (see apps/launcher/README.md).
exclude = ["apps/launcher/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/akbargg314/gamedist"

[workspace.dependencies]
gamedist-core = { path = "crates/core" }
gamedist-server = { path = "crates/server" }
gamedist-cli = { path = "crates/cli" }
gamedist-launcher = { path = "crates/launcher" }

base64 = "0.22"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fastcdc = "3"
futures-util = "0.3"
jsonschema = { version = "0.30", default-features = false }
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
walkdir = "2"

argon2 = "0.5"
indicatif = "0.17"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
rpassword = "7"
axum = { version = "0.8", features = ["macros"] }
maud = "0.26"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
strip = true

# Hashing and crypto are painfully slow unoptimised; keep tests fast.
[profile.dev.package."*"]
opt-level = 2
